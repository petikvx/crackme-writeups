solution_summary: >
  Clé d'accès = "KEY" (strcmp direct, pas de transformation). byte_4030 et
  byte_4037 ne sont pas deux tableaux distincts mais la meme chaine
  "mysteryKEY" vue a deux offsets : "mystery" (7 octets) alimente une
  boucle XOR 0xAB dont le resultat n'est jamais reutilise (code mort,
  leurre) ; "KEY" (offset +7) est copie tel quel dans le buffer compare.
  Binaire packe UPX 4.22 (repo n'a que UPX 3.96, incompatible) : depaquete
  en memoire en laissant le process se lancer normalement (bloque sur
  scanf au prompt), dump de /proc/<pid>/mem sur les 4 pages PT_LOAD
  anonymes -> ELF valide charge dans IDA (MCP ida) pour le pseudocode.

