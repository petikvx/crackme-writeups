solution_summary: >
  Pas un mot de passe : verify() (strcmp(buf+1,"3V4") avec strlen(buf)==8
  exige) ne peut mathematiquement jamais retourner 1 (contradiction entre
  strlen==8 et le \0 implicite de "3V4" en buf[4]) - leurre volontaire.
  Compile -no-pie -fno-stack-protector : strcpy(buf[32], argv[1]) sans
  borne -> debordement de pile classique. Payload 43 octets : 32 'A'
  (buf) + 8 'B' (RBP sauve, sans importance) + 3 octets bas (b7 11 40) de
  l'adresse de retour 0x004011b7 (juste apres le "test eax,eax;je" dans
  main, saute direct sur la branche "ACCESS GRANTED"). Les 5 octets hauts
  de la case retour sont deja a 0 (verifie sous GDB), pas d'octet nul a
  faire passer par argv. main plante ensuite (RBP corrompu, leave final)
  mais APRES avoir affiche le message - visible seulement via un pty
  (stdout ligne-bufferise), perdu sur un pipe plein-bufferise.

