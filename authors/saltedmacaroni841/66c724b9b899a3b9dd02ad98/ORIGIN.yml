  run, mais deja entierement calcule en memoire avant la saisie
  utilisateur. Resolu en pilotant le binaire sous GDB
  (tools/_level4_patch.gdb.py) : breakpoint juste avant la comparaison
  finale (sub_1DDF), lecture des 6 octets corrects dans RDI, ecriture de
  ces memes octets dans RSI (buffer de la saisie) - patch de donnees,
